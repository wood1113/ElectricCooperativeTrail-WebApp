      hint.textContent='TAP AN UNCONNECTED HOUSE — LINES APPEAR AS YOU BUILD';
      showActions(false)
    }
  }
  for(const n of nodes){
    const b=document.createElement('button');b.type='button';b.className='map-house'+(n.id==='P'?' source connected':'');b.style.left=n.x+'%';b.style.top=n.y+'%';b.textContent=n.id==='P'?'CO-OP':'';b.title=n.id==='P'?'Cooperative power source':'Connect this farmhouse';
    b.setAttribute('aria-label',n.id==='P'?'Cooperative power source':'Connect this farmhouse');
    if(n.id==='P')b.disabled=true;
    b.onclick=()=>{
      if(connected.has(n.id))return;
      const parent=nodes.filter(v=>connected.has(v.id)).sort((a,c)=>routeCost(n,a)-routeCost(n,c)||Math.hypot(n.x-a.x,n.y-a.y)-Math.hypot(n.x-c.x,n.y-c.y))[0];
      const cost=routeCost(n,parent);spent+=cost;connected.add(n.id);b.classList.add('connected');b.disabled=true;
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',parent.x);line.setAttribute('y1',parent.y);line.setAttribute('x2',n.x);line.setAttribute('y2',n.y);line.classList.add('route-line','active');svg.append(line);segments.push(line);
      refresh();
    };
    buttons.set(n.id,b);map.append(b)
  }
  map.append(hint);cv.after(map);cv.after(meter);refresh();
}
